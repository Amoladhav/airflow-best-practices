name: sales-lab-afl105

services:
  airflow-smoke:
    image: airflow-sales-lab:afl105
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - SALES_CSV_PATH=/opt/airflow/sample_data/sales.csv
      - SALES_DB_PATH=/opt/airflow/sales.db
    volumes:
      - airflow-state:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./sample_data:/opt/airflow/sample_data:ro
      - ./scripts:/opt/airflow/scripts:ro
volumes:
  airflow-state:
