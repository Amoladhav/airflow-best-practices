name: CI

on:
  push:
    branches: ["feature/**", dev, test, main]
  pull_request:
    branches: [dev, test, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-bookworm
    timeout-minutes: 15
    steps:
      - name: Checkout submitted revision
        uses: builtin:checkout
        with:
          persist-credentials: false

      - name: Show tested revision
        run: git rev-parse HEAD

      - name: Install development dependencies
        run: python3 -m pip install -e '.[dev]'

      - name: Run fast quality gate
        run: make check-fast
