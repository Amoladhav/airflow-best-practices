[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-sales-lab"
version = "0.1.0"
description = "Sales pipeline buisiness logic for an Airflow lab"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["sales_lab"]
namespaces = false

[tool.setuptools.package-data]
sales_lab = ["sql/*.sql"]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "pre-commit==4.7.0",

]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
filterwarnings = ["error::DeprecationWarning"]
